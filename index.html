
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wordly | Dictionary</title>

    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>

    <!-- Website header -->
    <header class="header">
        <h1 class="logo">Wordly<span>.</span></h1>

        <p>Personal dictionary</p>
        <button type="button" id="theme-button" aria-pressed="false">
            Switch to Light Theme
        </button>
    </header>

    <!-- Main application -->
    <main class="container">

        <!-- Search section -->
        <section class="search-section">
            <h2>Discover a word.</h2>

            <p>Search for a word to explore its meaning.</p>

            <form id="search-form">
                <label for="word-input">Enter a word</label>

                <div class="search-box">
                    <input
                        type="text"
                        id="word-input"
                        placeholder="e.g. curious"
                        required
                    >

                    <button type="submit" id="search-button">
                        Search
                    </button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <!-- Dictionary results -->
        <section id="results-section" aria-live="polite" hidden>

            <div class="word-heading">
                <div>
                    <h2 id="word-title"></h2>
                    <p id="phonetic"></p>
                </div>

                <button
                    type="button"
                    id="audio-button"
                    hidden
                    aria-label="Play pronunciation"
                >
                    Play pronunciation
                </button>
            </div>

            <div id="definitions-container"></div>

            <div class="synonyms-section">
                <h3>Synonyms</h3>
                <div id="synonyms-container"></div>
            </div>

            <p id="source-link"></p>

            <button type="button" id="save-button" hidden>
                Save Word
            </button>

        </section>

        <!-- Saved words -->
        <section class="saved-section">
            <h2>My Saved Words</h2>

            <p>Keep useful words for future reference.</p>

            <ul id="saved-words-list"></ul>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Wordly Dictionary. Learn a word every day.</p>
    </footer>

</body>
</html>
